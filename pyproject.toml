[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aslan-payment"
version = "0.2.0"
description = "Aslan Payment SDK for Python -- server-side payment integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Aslan", email = "dev@aslanpay.ma" },
]
keywords = [
    "aslan",
    "payment",
    "payment-gateway",
    "checkout",
    "morocco",
    "mad",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.0"]

[project.urls]
Homepage = "https://aslanpay.ma"
Documentation = "https://doc.aslanpay.ma"
Repository = "https://github.com/Belkouche/aslan-payment-python"
Issues = "https://github.com/Belkouche/aslan-payment-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["aslan_payment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
